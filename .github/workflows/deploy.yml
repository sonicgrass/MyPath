name: Automated Art Calendar Scraper

on:
  schedule:
    # Runs automatically every day at 6:00 AM UTC (2:00 AM EDT)
    - cron: '0 6 * * *'
  # Allows you to manually trigger the workflow anytime from the GitHub UI
  workflow_dispatch:

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 urllib3 google-genai

      - name: Execute Scraper Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scraper.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mypath_aggregated_calendar.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated daily calendar update [skip ci]" && git push)
