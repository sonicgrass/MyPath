<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyPath // Art & Exhibition Aggregator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,600;0,800;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #14161d;
            --card-border: #222633;
            --accent-gold: #d4af37;
            --accent-neon: #64ffda;
            --text-main: #e6e8ee;
            --text-muted: #9499ad;
            --badge-bg: #1e2230;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            padding-bottom: 60px;
        }

        header {
            border-bottom: 1px solid var(--card-border);
            background: rgba(11, 12, 16, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 20px 5%;
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo-title {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            letter-spacing: 2px;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .logo-title span { color: var(--accent-gold); }

        .tagline {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .controls {
            max-width: 1400px;
            margin: 25px auto;
            padding: 0 5%;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 280px;
            padding: 12px 18px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box:focus { border-color: var(--accent-gold); }

        .stats-badge {
            background: var(--badge-bg);
            border: 1px solid var(--card-border);
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--accent-neon);
            font-weight: 600;
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 5%;
        }

        .section-header {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            margin-bottom: 20px;
            border-left: 3px solid var(--accent-gold);
            padding-left: 12px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 24px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: rgba(212, 175, 55, 0.4);
        }

        .card.high-buzz {
            border: 1px solid rgba(100, 255, 218, 0.3);
            background: linear-gradient(180deg, rgba(20, 22, 29, 1) 0%, rgba(22, 32, 38, 0.6) 100%);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            gap: 10px;
        }

        .category-tag {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-gold);
            font-weight: 700;
        }

        .mentions-pill {
            background: rgba(100, 255, 218, 0.1);
            color: var(--accent-neon);
            border: 1px solid rgba(100, 255, 218, 0.3);
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .card-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.35rem;
            color: var(--text-main);
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .card-dates {
            font-size: 0.85rem;
            color: var(--accent-gold);
            margin-bottom: 14px;
            font-weight: 600;
        }

        .card-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .sources-section {
            border-top: 1px solid var(--card-border);
            padding-top: 14px;
            margin-top: auto;
        }

        .sources-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .sources-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .source-badge {
            background: var(--badge-bg);
            color: var(--text-main);
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 4px;
            text-decoration: none;
            border: 1px solid var(--card-border);
            transition: background 0.2s;
        }

        .source-badge:hover {
            background: var(--accent-gold);
            color: #000;
        }

        .loading {
            text-align: center;
            padding: 60px;
            font-size: 1.2rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div>
                <h1 class="logo-title">My<span>Path</span></h1>
                <p class="tagline">Fine Art Exhibition Radar & News Aggregator</p>
            </div>
        </div>
    </header>

    <div class="controls">
        <input type="text" id="searchInput" class="search-box" placeholder="Search exhibitions, museums, or artists...">
        <div class="stats-badge" id="statsCount">Loading records...</div>
    </div>

    <main class="main-container">
        <h2 class="section-header">Curated Exhibition Radar</h2>
        <div id="grid" class="grid">
            <div class="loading">Loading aggregated calendar data...</div>
        </div>
    </main>

    <script>
        // Parses standard CSV formatted strings cleanly
        function parseCSV(text) {
            const lines = [];
            let row = [], field = '', inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const c = text[i], next = text[i+1];
                if (c === '"') {
                    if (inQuotes && next === '"') { field += '"'; i++; }
                    else { inQuotes = !inQuotes; }
                } else if (c === ',' && !inQuotes) {
                    row.push(field.trim()); field = '';
                } else if ((c === '\r' || c === '\n') && !inQuotes) {
                    if (c === '\r' && next === '\n') { i++; }
                    row.push(field.trim());
                    if (row.length > 1 || row[0] !== '') lines.push(row);
                    row = []; field = '';
                } else {
                    field += c;
                }
            }
            if (field || row.length > 0) { row.push(field.trim()); lines.push(row); }
            return lines;
        }

        async function loadCalendar() {
            try {
                const response = await fetch('mypath_aggregated_calendar.csv', { cache: 'no-cache' });
                const csvText = await response.text();
                const parsed = parseCSV(csvText);
                
                if (parsed.length < 2) return;
                
                const headers = parsed[0];
                const rows = parsed.slice(1).map(r => ({
                    title: r[0] || 'Untitled Exhibition',
                    category: r[1] || 'FineArt',
                    dates: r[2] || 'Dates N/A',
                    hours: r[3] || '',
                    description: (r[4] && r[4] !== 'N/A') ? r[4] : 'Click source links below for full exhibition schedule and detail coverage.',
                    links: r[5] ? r[5].split(' | ') : [],
                    mentions: parseInt(r[6] || '1', 10),
                    sources: r[7] ? r[7].split(', ') : []
                }));

                // Sort by Mentions Count descending
                rows.sort((a, b) => b.mentions - a.mentions);
                
                window.allEvents = rows;
                renderCards(rows);
            } catch (err) {
                document.getElementById('grid').innerHTML = `<div class="loading">Failed to load calendar CSV. Ensure 'mypath_aggregated_calendar.csv' exists in the repository root.</div>`;
            }
        }

        function renderCards(events) {
            const grid = document.getElementById('grid');
            const stats = document.getElementById('statsCount');
            
            stats.innerText = `Tracking ${events.length} Exhibitions Across New England & Beyond`;
            
            if (events.length === 0) {
                grid.innerHTML = `<div class="loading">No exhibitions match your search filters.</div>`;
                return;
            }

            grid.innerHTML = events.map(ev => {
                const isHighBuzz = ev.mentions > 1;
                const sourcesHtml = ev.sources.map((src, i) => {
                    const url = ev.links[i] || ev.links[0] || '#';
                    return `<a href="${url}" target="_blank" rel="noopener" class="source-badge">${src}</a>`;
                }).join('');

                return `
                    <div class="card ${isHighBuzz ? 'high-buzz' : ''}">
                        <div>
                            <div class="card-header">
                                <span class="category-tag">${ev.category}</span>
                                <span class="mentions-pill">${ev.mentions} Source${ev.mentions > 1 ? 's' : ''} Tracking</span>
                            </div>
                            <h3 class="card-title">${ev.title}</h3>
                            <div class="card-dates">📅 ${ev.dates}</div>
                            <p class="card-desc">${ev.description}</p>
                        </div>
                        <div class="sources-section">
                            <div class="sources-label">Media & Gallery Sources</div>
                            <div class="sources-list">${sourcesHtml}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = (window.allEvents || []).filter(ev => 
                ev.title.toLowerCase().includes(term) || 
                ev.sources.some(s => s.toLowerCase().includes(term)) ||
                ev.description.toLowerCase().includes(term)
            );
            renderCards(filtered);
        });

        loadCalendar();
    </script>
</body>
</html>
