<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyPath // Art & Tech Exhibition Radar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #08090c;
            --bg-surface: #0f1117;
            --bg-card: #151821;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-active: rgba(0, 240, 255, 0.3);
            
            --accent-cyan: #00f0ff;
            --accent-amber: #ffb400;
            --accent-green: #00ffaa;
            
            --text-primary: #f0f2f8;
            --text-secondary: #9aa1b2;
            --text-tertiary: #62697a;
            
            --font-heading: 'Space Grotesk', sans-serif;
            --font-body: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.05) 0%, transparent 50%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            color: var(--text-primary);
            font-family: var(--font-body);
            line-height: 1.5;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        header {
            background: rgba(8, 9, 12, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-subtle);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 16px 5%;
        }

        .header-inner {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
            text-decoration: none;
        }

        .brand-logo span {
            color: var(--accent-cyan);
            font-family: var(--font-mono);
        }

        .toolbar {
            max-width: 1400px;
            margin: 32px auto 24px;
            padding: 0 5%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .search-bar-wrapper {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 14px 18px 14px 44px;
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 16px rgba(0, 240, 255, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-tertiary);
            font-family: var(--font-mono);
            font-size: 0.85rem;
        }

        .filter-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .filter-chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .chip {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .chip:hover, .chip.active {
            color: var(--accent-cyan);
            border-color: rgba(0, 240, 255, 0.4);
            background: rgba(0, 240, 255, 0.05);
        }

        .metric-counter {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--text-tertiary);
        }

        .metric-counter span {
            color: var(--text-primary);
            font-weight: 600;
        }

        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 5%;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.2s ease;
            position: relative;
        }

        .card:hover {
            border-color: var(--border-active);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .card.buzz-high {
            border-left: 3px solid var(--accent-cyan);
        }

        .card.buzz-mid {
            border-left: 3px solid var(--accent-amber);
        }

        .card-top {
            margin-bottom: 16px;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .category-badge {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-tertiary);
        }

        .consensus-tag {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
        }

        .buzz-high .consensus-tag {
            color: var(--accent-cyan);
            border-color: rgba(0, 240, 255, 0.3);
            background: rgba(0, 240, 255, 0.08);
        }

        .card-title {
            font-family: var(--font-heading);
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.35;
            margin-bottom: 8px;
        }

        .card-date {
            font-family: var(--font-mono);
            font-size: 0.78rem;
            color: var(--accent-amber);
            margin-bottom: 12px;
        }

        .card-desc {
            font-size: 0.88rem;
            color: var(--text-secondary);
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .card-footer {
            border-top: 1px solid var(--border-subtle);
            padding-top: 12px;
            margin-top: auto;
        }

        .sources-label {
            font-family: var(--font-mono);
            font-size: 0.68rem;
            color: var(--text-tertiary);
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .sources-flex {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .source-pill {
            font-family: var(--font-body);
            font-size: 0.75rem;
            color: var(--text-secondary);
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            padding: 3px 8px;
            border-radius: 4px;
            text-decoration: none;
            transition: all 0.15s ease;
        }

        .source-pill:hover {
            color: var(--bg-base);
            background: var(--accent-cyan);
            border-color: var(--accent-cyan);
            font-weight: 500;
        }

        .state-msg {
            text-align: center;
            padding: 80px 20px;
            font-family: var(--font-mono);
            color: var(--text-tertiary);
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .header-inner { flex-direction: column; align-items: flex-start; }
            .filter-row { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <div class="brand">
                <a href="#" class="brand-logo">MY<span>PATH</span></a>
            </div>
        </div>
    </header>

    <div class="toolbar">
        <div class="search-bar-wrapper">
            <span class="search-icon">/></span>
            <input type="text" id="searchInput" class="search-input" placeholder="Search exhibitions, artists, institutions, or keywords...">
        </div>

        <div class="filter-row">
            <div class="filter-chips">
                <button class="chip active" data-filter="all">All Items</button>
                <button class="chip" data-filter="consensus">High Consensus (>1 Source)</button>
                <button class="chip" data-filter="fineart">Fine Art</button>
            </div>
            <div class="metric-counter" id="metricCounter">
                INDEXED: <span>0</span> ITEMS
            </div>
        </div>
    </div>

    <main class="main-content">
        <div id="cardGrid" class="card-grid">
            <div class="state-msg">[SYS_INIT] Loading dataset stream...</div>
        </div>
    </main>

    <script>
        let rawEvents = [];
        let activeFilter = 'all';

        function parseCSV(text) {
            const lines = [];
            let row = [], field = '', inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const c = text[i], next = text[i+1];
                if (c === '"') {
                    if (inQuotes && next === '"') { field += '"'; i++; }
                    else { inQuotes = !inQuotes; }
                } else if (c === ',' && !inQuotes) {
                    row.push(field.trim()); field = '';
                } else if ((c === '\r' || c === '\n') && !inQuotes) {
                    if (c === '\r' && next === '\n') { i++; }
                    row.push(field.trim());
                    if (row.length > 1 || row[0] !== '') lines.push(row);
                    row = []; field = '';
                } else {
                    field += c;
                }
            }
            if (field || row.length > 0) { row.push(field.trim()); lines.push(row); }
            return lines;
        }

        async function initDashboard() {
            try {
                const res = await fetch('mypath_aggregated_calendar.csv?v=' + new Date().getTime());
                const csvData = await res.text();
                const rows = parseCSV(csvData);

                if (rows.length < 2) return;

                rawEvents = rows.slice(1).map(r => ({
                    title: r[0] || 'Untitled Show',
                    category: r[1] || 'FineArt',
                    dates: r[2] || 'Dates N/A',
                    hours: r[3] || '',
                    description: (r[4] && r[4] !== 'N/A') ? r[4] : 'Exhibition schedule and overview coverage available via source links.',
                    links: r[5] ? r[5].split(' | ') : [],
                    mentions: parseInt(r[6] || '1', 10),
                    sources: r[7] ? r[7].split(', ') : []
                }));

                rawEvents.sort((a, b) => b.mentions - a.mentions);
                applyFilters();
            } catch (err) {
                document.getElementById('cardGrid').innerHTML = 
                    `<div class="state-msg">[ERROR] Failed to load 'mypath_aggregated_calendar.csv'.</div>`;
            }
        }

        function renderGrid(data) {
            const grid = document.getElementById('cardGrid');
            const counter = document.getElementById('metricCounter');

            counter.innerHTML = `INDEXED: <span>${data.length}</span> ITEMS`;

            if (data.length === 0) {
                grid.innerHTML = `<div class="state-msg">[NO_MATCH] Zero records match current query parameters.</div>`;
                return;
            }

            grid.innerHTML = data.map(ev => {
                const buzzClass = ev.mentions > 2 ? 'buzz-high' : (ev.mentions > 1 ? 'buzz-mid' : '');
                
                // Map each source pill to its exact corresponding link
                const sourceLinks = ev.sources.map((src, idx) => {
                    const url = ev.links[idx] || ev.links[0] || '#';
                    return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="source-pill">${src} ↗</a>`;
                }).join('');

                return `
                    <article class="card ${buzzClass}">
                        <div class="card-top">
                            <div class="card-meta">
                                <span class="category-badge">${ev.category}</span>
                                <span class="consensus-tag">${ev.mentions} SRC${ev.mentions > 1 ? 'S' : ''}</span>
                            </div>
                            <h2 class="card-title">${ev.title}</h2>
                            <div class="card-date">// ${ev.dates}</div>
                            <p class="card-desc">${ev.description}</p>
                        </div>
                        <div class="card-footer">
                            <div class="sources-label">Tracking Nodes</div>
                            <div class="sources-flex">${sourceLinks}</div>
                        </div>
                    </article>
                `;
            }).join('');
        }

        function applyFilters() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            const filtered = rawEvents.filter(ev => {
                const matchesSearch = ev.title.toLowerCase().includes(searchTerm) ||
                                      ev.description.toLowerCase().includes(searchTerm) ||
                                      ev.sources.some(s => s.toLowerCase().includes(searchTerm));

                let matchesChip = true;
                if (activeFilter === 'consensus') matchesChip = ev.mentions > 1;
                if (activeFilter === 'fineart') matchesChip = ev.category.toLowerCase() === 'fineart';

                return matchesSearch && matchesChip;
            });

            renderGrid(filtered);
        }

        document.getElementById('searchInput').addEventListener('input', applyFilters);

        document.querySelectorAll('.chip').forEach(chip => {
            chip.addEventListener('click', (e) => {
                document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                e.target.classList.add('active');
                activeFilter = e.target.getAttribute('data-filter');
                applyFilters();
            });
        });

        initDashboard();
    </script>
</body>
</html>
